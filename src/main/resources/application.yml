spring:
  application:
    name: moyamoya
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://line4thon-moyamoya.vercel.app}

jwt:
  secret: ${JWT_SECRET}

clova:
  speech:
    invoke-url: ${CLOVA_SPEECH_INVOKE_URL}
    secret-key: ${CLOVA_SPEECH_SECRET_KEY}
    connect-timeout-ms: ${CLOVA_SPEECH_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLOVA_SPEECH_READ_TIMEOUT_MS:10000}

google:
  tts:
    language-code: ko-KR
    voice-name: ko-KR-Chirp3-HD-Leda

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:moyamoya-audio-dev-moya}
    region: ${AWS_REGION:ap-northeast-2}

question:
  session:
    cleanup-delay-ms: ${QUESTION_SESSION_CLEANUP_DELAY_MS:300000}

tts:
  processor-connect-timeout-ms: ${TTS_PROCESSOR_CONNECT_TIMEOUT_MS:2000}
  processor-read-timeout-ms: ${TTS_PROCESSOR_READ_TIMEOUT_MS:5000}
