spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/moyamoya?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    com.moyamoya: debug

jwt:
  access-token-expiration-ms: ${ACCESS_TOKEN_TTL:86400000}
  refresh-token-expiration-ms: ${REFRESH_TOKEN_TTL:7776000000}
  parent-mode-token-expiration-ms: ${PARENT_MODE_TOKEN_TTL:28800000}

parent-pin:
  max-failed-attempts: ${PARENT_PIN_MAX_FAILED_ATTEMPTS:5}
  failure-window-ms: ${PARENT_PIN_FAILURE_WINDOW_MS:300000}
  block-duration-ms: ${PARENT_PIN_BLOCK_DURATION_MS:300000}

tts:
  processor-url: http://127.0.0.1:8001

aws:
  s3:
    prefix: ${S3_PREFIX:local}
