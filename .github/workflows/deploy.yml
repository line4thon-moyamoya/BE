name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          : "${EC2_HOST:?Set EC2_HOST in Actions secrets}"
          : "${EC2_USER:?Set EC2_USER in Actions secrets}"
          : "${EC2_SSH_KEY:?Set EC2_SSH_KEY in Actions secrets}"
          : "${EC2_KNOWN_HOSTS:?Set EC2_KNOWN_HOSTS in Actions secrets}"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          if ! ssh-keygen -y -P '' -f "$HOME/.ssh/deploy_key" > /dev/null 2>&1; then
            echo 'Invalid EC2_SSH_KEY: paste the complete private key, including BEGIN/END lines. This workflow requires a key without a passphrase.' >&2
            exit 1
          fi
      - name: Deploy tested commit and verify API
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=5 \
            -l "$EC2_USER" "$EC2_HOST" "bash -s -- '$GITHUB_SHA'" < deploy/deploy.sh
      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
